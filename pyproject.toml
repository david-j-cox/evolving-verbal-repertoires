[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evb"
version = "0.1.0"
description = "Evolving Verbal Behavior: phoneme-level simulation of Skinner's verbal operants"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["jupyter", "ipykernel"]
ui = ["streamlit>=1.30", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
